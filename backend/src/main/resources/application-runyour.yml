# Common provider overlay (owner, 2026-11-15). Add SPRING_PROFILES_INCLUDE=runyour.
# This changes connection settings only: no capability or org is enabled here.
# Direct-provider deployments keep application.yml unless they explicitly include this profile.
# Keys stay in the backend environment. Never put a real key in this file or a VITE_* variable.
sellerops.reply-agent.vendor: RUNYOUR
sellerops.reply-agent.model: ${RUNYOUR_MODEL:anthropic/claude-opus-5-5}
sellerops.reply-agent.api-key: ${RUNYOUR_API_KEY:}
