# Unknown Runyour prices must never silently inherit direct Anthropic/OpenAI dollar estimates.
# The USD evaluation meter is optional. When enabled it requires verified USD-equivalent prices.
# Credit rounding and exchange rates must be included separately in the approved evaluation estimate.
sellerops.dev.llm-price-in-per-mtok: ${RUNYOUR_INPUT_USD_PER_MTOK:-1}
sellerops.dev.llm-price-out-per-mtok: ${RUNYOUR_OUTPUT_USD_PER_MTOK:-1}
