spring:
  datasource:
    url: jdbc:h2:mem:vendor_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

vendor:
  session:
    secret: test-only-session-key-not-for-any-deployment-0123456789
  totp:
    # The bytes 00..1f, base64. Test-only.
    key: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
