# Hermetic test profile: H2 in PostgreSQL mode, the real Flyway migrations, and a test-only session key.
spring:
  datasource:
    url: jdbc:h2:mem:vendor_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

vendor:
  session:
    secret: test-only-session-key-not-for-any-deployment-0123456789
  totp:
    # The bytes 00..1f, base64. Test-only.
    key: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
  # The retention pass runs on the real clock; tests drive Retention with their own and turn the schedule off.
  retention:
    enabled: false
  # Step-up codes and new-PC notices land in the in-memory outbox, where tests read them.
  mail:
    mode: dev-outbox
  # The workspace server's service token in tests is rvw_test-only-workspace-service-token; this is its SHA-256.
  workspace:
    service-token-sha256: 4a474d1f9365547617b06574e4164bf34a735c4b7d57274eb48956345b2c99b6
