# The vendor server (docs/vendor_server_contract_v1.md). Nothing here is a secret — secrets arrive by environment;
# nothing here names a channel API.
spring:
  application:
    name: sellerops-vendor-server
  main:
    banner-mode: off
  # The server's own database (contract §9). Supplied by the deployment; there is no default to fall back to.
  datasource:
    url: ${VENDOR_DB_URL}
    username: ${VENDOR_DB_USER}
    password: ${VENDOR_DB_PASSWORD}
  flyway:
    enabled: true
  # A delegate's review export (contract §3.1): 10MB, the same cap as the backend's upload.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
      # Above the request cap, so the container never spools an upload to its temp folder — the default (0B) writes
      # every file part to disk before the controller sees it. The export is read from memory and dropped (§3.1);
      # UploadStaysInMemoryTest looks in that folder mid-request.
      file-size-threshold: 13MB

vendor:
  # The address people open this server at (https://…, no trailing path). Only the operator commands read it, to print
  # a delegate's join link whole; unset, they print the path alone.
  public-url: ${VENDOR_PUBLIC_URL:}
  session:
    # HS256 key for seller sessions — at least 32 characters, required; SessionTokens refuses to start without it.
    secret: ${VENDOR_SESSION_SECRET:}
  mail:
    # smtp (spring.mail.* / SPRING_MAIL_HOST… — the server refuses to start without a host) | dev-outbox (mails, one-time
    # codes included, go to THIS LOG — local runs only) | off (default: nothing is sent, so no new PC can be linked).
    mode: ${VENDOR_MAIL_MODE:off}
    from: ${VENDOR_MAIL_FROM:no-reply@localhost}
    # Where a seller's reply to a new-PC notice goes — the operator. Optional.
    reply-to: ${VENDOR_MAIL_REPLY_TO:}
  totp:
    # AES-256 key (base64, 32 bytes) that seals delegates' TOTP secrets — required; TotpSecretBox refuses to start
    # without it. Separate from the session key: one leaking does not give the other.
    key: ${VENDOR_TOTP_KEY:}

server:
  port: ${VENDOR_SERVER_PORT:8090}
  # Behind the edge (Caddy): trust X-Forwarded-For only from the internal proxy range, so the caller's address is
  # the edge's view of it — contract §7.
  forward-headers-strategy: native
  # Every response says UTF-8, including the static approval page (/link) — Korean text, no guessing.
  servlet:
    encoding:
      charset: UTF-8
      force: true
  # Error responses carry a status, never a message, a stack trace or request material (contract §9).
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
