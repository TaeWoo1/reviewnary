<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>할 일 · reviewnary</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/replies/replies.js" defer></script>
</head>
<body>
<main class="page" aria-label="할 일">

  <section id="view-login" aria-label="로그인" hidden>
    <h1>할 일</h1>
    <form id="login-form" class="card" novalidate>
      <p>판매자 계정으로 로그인하세요.</p>
      <label for="email">이메일</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">비밀번호</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <p id="login-error" class="msg bad-text" role="alert" hidden></p>
      <button type="submit" class="btn solid big">로그인</button>
    </form>
  </section>

  <section id="view-list" aria-label="할 일 목록" hidden>
    <div class="bar">
      <h1>할 일</h1>
      <button type="button" id="refresh" class="btn text">새로고침</button>
    </div>
    <div class="stack24">
      <p id="pc-off" class="msg warn-text" role="status" hidden>PC 꺼짐 · 새 초안과 검사는 PC가 켜진 뒤</p>
      <p id="list-notice" class="msg" role="status" hidden></p>
      <div class="tabs" role="group" aria-label="보기">
        <button type="button" class="tab on" data-tab="todo" aria-pressed="true">내가 할 일 <span id="todo-count"></span></button>
        <button type="button" class="tab" data-tab="moving" aria-pressed="false">진행 중 <span id="moving-count"></span></button>
        <button type="button" class="tab" data-tab="done" aria-pressed="false">끝난 일 <span id="done-count"></span></button>
      </div>
      <div id="list-todo" class="list"></div>
      <div id="list-moving" class="list" hidden></div>
      <div id="list-done" class="list" hidden></div>
      <p id="list-empty" class="card muted" hidden></p>
      <p class="xs muted">PC가 만든 리뷰 답글 초안이 PC와 똑같이 보입니다. 문의는 PC에서.</p>
      <button type="button" id="logout" class="btn text">로그아웃</button>
    </div>
  </section>

  <section id="view-task" aria-label="답글" hidden>
    <div class="bar">
      <button type="button" id="back" class="btn link">‹ 할 일</button>
      <span id="task-state" class="chip" hidden></span>
    </div>
    <div class="stack">
      <div class="card stack8">
        <div class="row"><span id="review-stars" class="stars"></span><span id="review-meta" class="sm muted"></span></div>
        <p id="review-body" class="lg draft"></p>
        <div id="review-attachment" class="row" hidden>
          <img id="review-photo" class="photo" alt="리뷰 첨부 이미지" referrerpolicy="no-referrer">
          <span id="review-attachment-note" class="xs muted"></span>
        </div>
        <p id="review-flag" class="sm warn-text" hidden></p>
      </div>

      <div class="card stack8">
        <div class="between">
          <label id="draft-label" for="reply-edit" class="sm muted">답변 초안</label>
          <span id="draft-status" class="xs strong" aria-live="polite"></span>
        </div>
        <div id="why" class="inset stack8" hidden>
          <p id="why-text" class="sm"></p>
          <p id="why-todo" class="sm muted"></p>
        </div>
        <textarea id="reply-edit" rows="7" hidden></textarea>
        <p id="reply-body" class="draft" hidden></p>
        <div id="checks" class="inset" hidden><p id="checks-text" class="sm warn-text"></p></div>
      </div>

      <p id="task-error" class="msg bad-text" role="alert" hidden></p>

      <button type="button" id="approve" class="btn solid big" hidden>답글 등록 요청</button>
      <p id="approve-note" class="xs muted" hidden>이 문장 그대로 승인 · 담당자가 네이버에 등록</p>
      <p id="state-note" class="sm" hidden></p>
      <button type="button" id="cancel" class="btn outline big" hidden>요청 취소</button>
      <div id="confirm-cancel" class="inset stack8" hidden>
        <p id="confirm-cancel-text" class="sm"></p>
        <div class="row">
          <button type="button" id="cancel-yes" class="btn outline">취소하기</button>
          <button type="button" id="cancel-no" class="btn text">그대로 두기</button>
        </div>
      </div>
    </div>
  </section>

</main>
</body>
</html>
