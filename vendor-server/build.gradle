// The vendor server — the seller-PC product's only central service (docs/vendor_server_contract_v1.md, D1).
// A separate build on purpose: nothing from backend/ is on this classpath, so the channel API clients and the
// credential vault are absent from this artifact by construction, and VendorServerScopeFenceTest keeps them out
// of the source too. Same stack as backend/ (Spring Boot 3.3.4, Java 17, Gradle 8.10.2 wrapper).
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.sellerops'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
