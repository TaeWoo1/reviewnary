// The vendor server — the seller-PC product's only central service (docs/vendor_server_contract_v1.md, D1).
// A separate build on purpose: nothing from backend/ is on this classpath, so the channel API clients and the
// credential vault are absent from this artifact by construction, and VendorServerScopeFenceTest keeps them out
// of the source too. Same stack as backend/ (Spring Boot 3.3.4, Java 17, Gradle 8.10.2 wrapper).
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.sellerops'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    // The seller's step-up code and the new-PC notice (contract §2) — same starter as backend/'s mailer.
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.flywaydb:flyway-core'
    // Reading the delegate's review export (contract §3.1) — same library and version as backend/'s FileParser.
    implementation 'org.apache.poi:poi-ooxml:5.3.0'
    implementation 'org.flywaydb:flyway-database-postgresql'
    // The authenticator QR on the delegate's join page (contract §2): the page runs under default-src 'self', so the
    // server encodes the QR and the page only draws its modules. Core only — no image or web module.
    implementation 'com.google.zxing:core:3.5.3'
    runtimeOnly 'org.postgresql:postgresql'

    // Seller sessions (contract §2) — same library and version as backend/.
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // Hermetic tests: the same Flyway migrations run on H2 in PostgreSQL mode, so CI needs no database.
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
